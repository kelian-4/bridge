networks:
  bridgenet:
    external: true
    name: bridgenet

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["local-postgres"]
    container_name: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: "synapse,mautrix_whatsapp,mautrix_signal"
      POSTGRES_USER: bridgeadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - bridgenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgeadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    profiles: ["local-synapse"]
    container_name: synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      SYNAPSE_SERVER_NAME: local.bridge
      SYNAPSE_REPORT_STATS: "no"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      UID: ${HOST_UID:-991}
      GID: ${HOST_GID:-991}
    secrets:
      - registration_shared_secret
      - macaroon_secret_key
      - form_secret
      - signal_registration
      - whatsapp_registration
      - telegram_registration
    volumes:
      - ./synapse:/data
    networks:
      - bridgenet
    # Pas de port exposé publiquement ici: nginx (reverse proxy) fera le
    # relais TLS vers ce port en interne uniquement, cf étape durcissement.
    expose:
      - "8008"
    ports:
      - "127.0.0.1:8008:8008"

  mautrix-whatsapp:
    image: ${WHATSAPP_IMAGE:-dock.mau.dev/mautrix/whatsapp:latest}
    profiles: ["local-whatsapp"]
    container_name: mautrix-whatsapp
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
        required: false
    environment:
      BRIDGE_APPSERVICE__AS_TOKEN: ${WHATSAPP_AS_TOKEN}
      BRIDGE_APPSERVICE__HS_TOKEN: ${WHATSAPP_HS_TOKEN}
      UID: ${HOST_UID:-1337}
      GID: ${HOST_GID:-1337}
    volumes:
      - ./mautrix-whatsapp:/data
    networks:
      - bridgenet

  mautrix-signal:
    image: ${SIGNAL_IMAGE:-dock.mau.dev/mautrix/signal:latest}
    profiles: ["local-signal"]
    container_name: mautrix-signal
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
        required: false
    environment:
      BRIDGE_APPSERVICE__AS_TOKEN: ${SIGNAL_AS_TOKEN}
      BRIDGE_APPSERVICE__HS_TOKEN: ${SIGNAL_HS_TOKEN}
      UID: ${HOST_UID:-1337}
      GID: ${HOST_GID:-1337}
    volumes:
      - ./mautrix-signal:/data
    networks:
      - bridgenet

  mautrix-telegram:
    image: ${TELEGRAM_IMAGE:-dock.mau.dev/mautrix/telegram:latest}
    profiles: ["local-telegram"]
    container_name: mautrix-telegram
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
        required: false
    environment:
      BRIDGE_APPSERVICE__AS_TOKEN: ${TELEGRAM_AS_TOKEN:-}
      BRIDGE_APPSERVICE__HS_TOKEN: ${TELEGRAM_HS_TOKEN:-}
      BRIDGE_NETWORK__API_ID: ${TELEGRAM_API_ID:-}
      BRIDGE_NETWORK__API_HASH: ${TELEGRAM_API_HASH:-}
      UID: ${HOST_UID:-1337}
      GID: ${HOST_GID:-1337}
    volumes:
      - ./mautrix-telegram:/data
    networks:
      - bridgenet

  auto-bridge-signal:
    build: ./auto-bridge
    profiles: ["local-auto-bridge"]
    container_name: auto-bridge-signal
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
        required: false
      mautrix-signal:
        condition: service_started
        required: false
    env_file:
      - ../.env
    network_mode: host
    environment:
      SYNC_TOKEN_FILE: /state/signal_next_batch
    volumes:
      - ../script/server:/app:ro
      - auto_bridge_state:/state

  auto-bridge-telegram:
    build: ./auto-bridge
    profiles: ["local-auto-bridge"]
    container_name: auto-bridge-telegram
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_started
        required: false
      mautrix-telegram:
        condition: service_started
        required: false
    env_file:
      - ../.env
    network_mode: host
    command: ["auto_bridge.py"]
    environment:
      SYNC_TOKEN_FILE: /state/telegram_next_batch
      REQUIRED_VARS: MATRIX_ACCESS_TOKEN TELEGRAM_RELAY_LOGIN_ID
      SERVICE_NAME: auto-bridge-telegram
    volumes:
      - ../script/server:/app:ro
      - auto_bridge_state:/state

volumes:
  auto_bridge_state:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  registration_shared_secret:
    file: ./secrets/registration_shared_secret
  macaroon_secret_key:
    file: ./secrets/macaroon_secret_key
  form_secret:
    file: ./secrets/form_secret
  signal_registration:
    file: ./secrets/signal_registration
  whatsapp_registration:
    file: ./secrets/whatsapp_registration
  telegram_registration:
    file: ./secrets/telegram_registration
